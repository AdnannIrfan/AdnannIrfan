<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="Number of projects using each technology: Python 8, Flask 5, SQL Server 5, C# Blazor 3, HTML and CSS 3, Flutter and Dart 2, JavaScript 2, Firebase 2">
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 10s ease-in-out infinite both}
.num{animation:fade 10s ease-in-out infinite both}
@keyframes grow{0%{transform:scaleX(0)}12%{transform:scaleX(1)}88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fade{0%,8%{opacity:0}16%,88%{opacity:1}100%{opacity:0}}
</style>
