<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-label="GramSure's 12 modules. Recipe Standards, Production Batches, Fraud Detection and Owner Notification Center are built by Muhammad Adnan Ali">
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.t{animation:appear 10s ease-out infinite both}
.mine rect{animation:glow 2.4s ease-in-out infinite}
@keyframes appear{0%{opacity:0;transform:translateY(10px)}7%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes glow{0%,100%{stroke-opacity:1;stroke-width:2}50%{stroke-opacity:.35;stroke-width:4}}
</style>
<rect x="1" y="1" width="798" height="428" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#f8fafc">GramSure: 12 interoperable modules</text>
<text x="32" y="70" font-size="13" fill="#94a3b8">From raw material purchase to live profit and loss, with fraud detection and owner alerts</text>

